<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photobooth</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Material Web Components -->
    <script type="importmap">
    {
        "imports": {
            "@material/web/": "https://esm.run/@material/web/"
        }
    }
    </script>
    <script type="module">
        import '@material/web/all.js';
    </script>
</head>
<body>
    <div class="container">
        
        <!-- ==================== LANDING PAGE ==================== -->
        <div id="landing-page" class="page">
            <md-outlined-card class="content-card">
                <h1>Photobooth</h1>
                <p>Capture three photos to create your photostrip.</p>
                <md-filled-button id="start-btn">
                    <md-icon slot="icon">camera_alt</md-icon>
                    Start
                </md-filled-button>
            </md-outlined-card>
        </div>

        <!-- ==================== PHOTOBOOTH PAGE ==================== -->
        <div id="photobooth-page" class="page hidden">
            <div class="photobooth-layout">
                
                <!-- Left Section: Thumbnails & Capture Button -->
                <div class="left-section">
                    <div class="thumbnails">
                        <div class="thumbnail-container" data-slot="0">
                            <img id="slot-1" src="Slot 1.png" alt="Photo slot 1" class="thumbnail">
                            <div class="thumbnail-overlay">
                                <span class="material-symbols-outlined">refresh</span>
                                <span>Retake</span>
                            </div>
                        </div>
                        <div class="thumbnail-container" data-slot="1">
                            <img id="slot-2" src="Slot 2.png" alt="Photo slot 2" class="thumbnail">
                            <div class="thumbnail-overlay">
                                <span class="material-symbols-outlined">refresh</span>
                                <span>Retake</span>
                            </div>
                        </div>
                        <div class="thumbnail-container" data-slot="2">
                            <img id="slot-3" src="Slot 3.png" alt="Photo slot 3" class="thumbnail">
                            <div class="thumbnail-overlay">
                                <span class="material-symbols-outlined">refresh</span>
                                <span>Retake</span>
                            </div>
                        </div>
                    </div>
                    <md-filled-tonal-button id="capture-btn">
                        <md-icon slot="icon">camera</md-icon>
                        Take Picture
                    </md-filled-tonal-button>
                </div>

                <!-- Right Section: Camera Feed -->
                <div class="camera-section">
                    <div class="camera-container">
                        <video id="video-feed" autoplay playsinline muted></video>
                        <div id="countdown-overlay" class="countdown"></div>
                        <canvas id="capture-canvas" class="hidden"></canvas>
                    </div>
                </div>
                
            </div>
        </div>

        <!-- ==================== RESULT PAGE ==================== -->
        <div id="result-page" class="page hidden">
            <md-outlined-card class="content-card result-layout">
                
                <!-- Left Column: Final Image -->
                <div class="result-left">
                    <div class="final-image-container">
                        <img id="final-image" src="" alt="Final photostrip">
                        <canvas id="composite-canvas" class="hidden"></canvas>
                    </div>
                </div>
                
                <!-- Right Column: QR Code & Actions -->
                <div class="result-right">
                    <!-- QR Code Section -->
                    <div id="qr-container" class="qr-section">
                        <md-circular-progress id="qr-loading" indeterminate></md-circular-progress>
                        <div id="qr-frame" class="qr-frame hidden">
                            <img id="qr-code" src="" alt="QR Code">
                        </div>
                    </div>
                    
                    <!-- Action Buttons -->
                    <div class="action-bar">
                        <md-filled-button id="print-btn">
                            <md-icon slot="icon">print</md-icon>
                            Print
                        </md-filled-button>
                        <md-outlined-button id="download-btn">
                            <md-icon slot="icon">download</md-icon>
                            Download
                        </md-outlined-button>
                        <md-outlined-button id="restart-btn">
                            <md-icon slot="icon">refresh</md-icon>
                            Start Over
                        </md-outlined-button>
                    </div>
                </div>
                
            </md-outlined-card>
        </div>

        <!-- ==================== ERROR DIALOG ==================== -->
        <div id="error-dialog" class="dialog hidden">
            <div class="dialog-content">
                <h3>Error</h3>
                <p id="error-message"></p>
                <md-filled-button id="error-close-btn">Close</md-filled-button>
            </div>
        </div>
        
    </div>

    <!-- Application Script -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
